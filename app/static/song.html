<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song · Audio Workstation</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/common.js"></script>
</head>
<body>
<main>
  <section class="panel row" id="info"></section>
  <section class="panel">
    <div class="row" style="margin-bottom:12px">
      <button id="play" class="primary" style="min-width:90px" disabled>Loading…</button>
      <span id="time" class="muted">0:00</span>
      <input id="seek" type="range" class="grow" min="0" max="1" step="0.01" value="0">
      <span id="dur" class="muted">0:00</span>
    </div>
    <div class="row">
      <span>Speed</span>
      <button id="slower">−</button>
      <select id="speed"></select>
      <button id="faster">+</button>
      <span class="muted">Pitch stays the same. Space = play/pause.</span>
    </div>
  </section>
  <section class="panel">
    <div class="row" style="margin-bottom:4px"><h2 class="grow" style="margin:0">Tracks</h2><button id="reset">Reset mix</button></div>
    <div id="tracks"></div>
    <div class="row" style="margin-top:10px">
      <button id="backing" class="primary">Download backing track</button>
      <span class="muted">Mixes the tracks at the volumes above into one MP3 and saves it to your computer.</span>
    </div>
  </section>
  <section class="panel row">
    <span class="grow muted" id="model"></span>
    <button id="resplit">Split again</button>
    <button id="delete" class="danger">Delete song</button>
  </section>
</main>

<script>
header("library");
const $ = id => document.getElementById(id);
const songId = new URLSearchParams(location.search).get("id");
const ctx = new AudioContext();
let tracks = [], speed = 1, playing = false, syncTimer = null;

async function init() {
  const [song, cfg] = await Promise.all([api(`/api/songs/${enc(songId)}`), api("/api/config")]);
  document.title = `${song.title || song.id} · Audio Workstation`;
  $("info").innerHTML = `
    ${song.has_cover ? `<img class="cover" style="width:72px;height:72px" src="/media/${enc(song.id)}/cover.jpg" alt="">` : ""}
    <div class="grow"><h1>${esc(song.title || song.id)}</h1>
    <div class="muted">${esc([song.artist, song.album, song.year].filter(Boolean).join(" · "))}</div></div>
    <a href="/media/${enc(song.id)}/original.mp3" download>Download MP3</a>`;
  $("model").textContent = song.split_model ? `Split with ${song.split_model}` : "";

  // speed choices from config
  const { min, max, step } = cfg.speed;
  for (let v = min; v <= max + 1e-9; v += step) $("speed").add(new Option(`${v.toFixed(2)}x`, v.toFixed(2)));
  $("speed").value = cfg.speed.default.toFixed(2);
  speed = +$("speed").value;

  if (!song.stems.length && song.job && song.job.status !== "error") {
    $("tracks").innerHTML = `<p class="muted">Tracks are being made (${esc(song.job.status)} ${song.job.progress}%). This page refreshes on its own.</p>`;
    setTimeout(() => location.reload(), 5000);
  } else if (!song.stems.length) {
    $("tracks").innerHTML = `<p class="muted">${song.job ? "Splitting failed: " + esc(song.job.message) : "This song was downloaded without splitting. Only the original plays."} Press <b>Split</b> below to make the separate tracks.</p>`;
    $("resplit").textContent = "Split";
  }
  const names = [...song.stems, ...(song.has_original ? ["original"] : [])];
  tracks = names.map(name => {
    const a = new Audio(name === "original" ? `/media/${enc(song.id)}/original.mp3` : `/media/${enc(song.id)}/stems/${enc(name)}.mp3`);
    a.preload = "auto";
    a.preservesPitch = true;
    const gain = ctx.createGain();
    ctx.createMediaElementSource(a).connect(gain).connect(ctx.destination);
    const vol = name === "original" && song.stems.length ? 0 : 1;  // full mix starts silent when stems exist
    gain.gain.value = vol;
    return { name, a, gain, vol, muted: false };
  });
  $("tracks").insertAdjacentHTML("beforeend", tracks.map((t, i) => `
    <div class="track"><span>${esc(t.name)}</span>
      <input type="range" min="0" max="100" value="${t.vol * 100}" data-i="${i}" aria-label="${esc(t.name)} volume">
      <span class="muted" id="v${i}">${t.vol * 100}%</span>
      <label class="muted"><input type="checkbox" data-m="${i}"> mute</label></div>`).join(""));

  const master = tracks[0]?.a;
  if (!master) return;
  master.addEventListener("loadedmetadata", () => { $("seek").max = master.duration; $("dur").textContent = fmtTime(master.duration); });
  master.addEventListener("canplay", () => { if (!playing) { $("play").disabled = false; $("play").textContent = "Play"; } });
  master.addEventListener("ended", () => setPlaying(false));
}

function allAudio(fn) { tracks.forEach(t => fn(t.a)); }

async function setPlaying(on) {
  playing = on;
  $("play").textContent = on ? "Pause" : "Play";
  clearInterval(syncTimer);
  if (on) {
    await ctx.resume();
    const t0 = tracks[0].a.currentTime;
    allAudio(a => { a.currentTime = t0; a.playbackRate = speed; });
    await Promise.all(tracks.map(t => t.a.play()));
    syncTimer = setInterval(sync, 200);
  } else {
    allAudio(a => a.pause());
  }
}

// Keep every track locked to the first one: nudge the rate for small drift, jump for big drift.
function sync() {
  const m = tracks[0].a;
  $("time").textContent = fmtTime(m.currentTime);
  if (!seeking) $("seek").value = m.currentTime;
  for (const t of tracks.slice(1)) {
    const drift = t.a.currentTime - m.currentTime;
    if (Math.abs(drift) > 0.25) { t.a.currentTime = m.currentTime; t.a.playbackRate = speed; }
    else if (Math.abs(drift) > 0.015) t.a.playbackRate = speed * (1 - Math.max(-0.05, Math.min(0.05, drift)));
    else if (t.a.playbackRate !== speed) t.a.playbackRate = speed;
  }
}

function setSpeed(v) {
  speed = +v;
  $("speed").value = speed.toFixed(2);
  allAudio(a => { a.playbackRate = speed; });
}

let seeking = false;
$("seek").oninput = () => { seeking = true; $("time").textContent = fmtTime($("seek").value); };
$("seek").onchange = () => { allAudio(a => { a.currentTime = +$("seek").value; }); seeking = false; };
$("play").onclick = () => setPlaying(!playing);
$("speed").onchange = () => setSpeed($("speed").value);
$("slower").onclick = () => { const i = $("speed").selectedIndex; if (i > 0) setSpeed($("speed").options[i - 1].value); };
$("faster").onclick = () => { const s = $("speed"), i = s.selectedIndex; if (i < s.options.length - 1) setSpeed(s.options[i + 1].value); };
function applyGain(i) {
  const t = tracks[i];
  t.gain.gain.value = t.muted ? 0 : t.vol;
  document.querySelector(`[data-i="${i}"]`).value = t.vol * 100;
  document.querySelector(`[data-m="${i}"]`).checked = t.muted;
  $("v" + i).textContent = Math.round(t.vol * 100) + "%";
}
$("tracks").oninput = e => {
  const { i, m } = e.target.dataset;
  if (i !== undefined) tracks[i].vol = e.target.value / 100;
  else if (m !== undefined) tracks[m].muted = e.target.checked;
  else return;
  applyGain(i ?? m);
};
$("reset").onclick = () => {
  tracks.forEach((t, i) => { t.vol = t.name === "original" && tracks.length > 1 ? 0 : 1; t.muted = false; applyGain(i); });
  setSpeed(1);
};
$("backing").onclick = async () => {
  const gains = Object.fromEntries(tracks.map(t => [t.name, t.muted ? 0 : t.vol]));
  $("backing").disabled = true; $("backing").textContent = "Mixing…";
  try {
    const res = await fetch(`/api/songs/${enc(songId)}/mix`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ gains }) });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const name = decodeURIComponent((res.headers.get("Content-Disposition") || "").match(/filename\*=utf-8''([^;]+)/i)?.[1] || "backing track.mp3");
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await res.blob()), download: name });
    a.click(); URL.revokeObjectURL(a.href);
  } catch (err) { alert(err.message); }
  $("backing").disabled = false; $("backing").textContent = "Download backing track";
};
$("delete").onclick = async () => {
  if (!confirm("Delete this song, its tracks and its collection entries? This cannot be undone.")) return;
  try { await api(`/api/songs/${enc(songId)}`, { method: "DELETE" }); location.href = "/"; } catch (err) { alert(err.message); }
};
$("resplit").onclick = async () => {
  if (!confirm("Split this song again? Current tracks are replaced when it finishes.")) return;
  try { await api(`/api/songs/${enc(songId)}/split`, { method: "POST" }); alert("Queued. Progress is on the Monitor page."); }
  catch (err) { alert(err.message); }
};
document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT" && !$("play").disabled) {
    e.preventDefault(); setPlaying(!playing);
  }
});

init().catch(err => { $("info").innerHTML = `<p>${esc(err.message)}</p>`; });
</script>
</body>
</html>
